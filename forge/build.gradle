plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "lexikon.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
    forgeRuntimeLibrary.extendsFrom shadowBundle
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    configurations.all {
        resolutionStrategy {
            force 'org.slf4j:slf4j-api:2.0.16'
            force 'com.ibm.icu:icu4j:71.1'
            force 'org.apache.logging.log4j:log4j-api:2.19.0'
            force 'org.lwjgl:lwjgl:3.3.2'
            force 'org.lwjgl:lwjgl-glfw:3.3.2'
            force 'org.lwjgl:lwjgl-jemalloc:3.3.2'
            force 'org.lwjgl:lwjgl-openal:3.3.2'
            force 'org.lwjgl:lwjgl-opengl:3.3.2'
            force 'org.lwjgl:lwjgl-stb:3.3.2'
            force 'org.lwjgl:lwjgl-tinyfd:3.3.2'
            force 'net.minecrell:terminalconsoleappender:1.3.0'
            force 'org.apache.logging.log4j:log4j-core:2.19.0'
            force 'org.apache.commons:commons-lang3:3.17.0'
            force 'com.google.code.gson:gson:2.11.0'
            force 'com.google.guava:guava:33.3.1-jre'
            force 'com.google.guava:failureaccess:1.0.2'
            force 'com.google.code.findbugs:jsr305:3.0.2'
            force 'org.checkerframework:checker-qual:3.43.0'
            force 'com.google.errorprone:error_prone_annotations:2.28.0'
            force 'com.google.j2objc:j2objc-annotations:3.0.0'
            force 'org.ow2.asm:asm:9.7.1'
            force 'org.ow2.asm:asm-tree:9.7.1'
            force 'commons-logging:commons-logging:1.3.4'
            force 'com.carrotsearch:hppc:0.8.2'
            force 'org.carrot2:morfologik-fsa:2.1.9'
            force 'org.carrot2:morfologik-stemming:2.1.9'
            force 'com.google.protobuf:protobuf-java:3.25.5'
            force 'org.hdrhistogram:HdrHistogram:2.1.12'
            force 'io.prometheus:simpleclient:0.16.0'
            force 'io.opentelemetry:opentelemetry-api:1.42.1'
            force 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
            force 'org.jline:jline-reader:3.20.0'
            force 'org.jline:jline-terminal:3.20.0'
            force 'commons-beanutils:commons-beanutils:1.9.4'

            failOnVersionConflict()
        }
    }

    shadowBundle 'org.languagetool:language-en:6.6'
    shadowBundle 'org.languagetool:language-de:6.6'
    shadowBundle 'org.languagetool:language-it:6.6'
    shadowBundle 'org.languagetool:language-es:6.6'
    shadowBundle 'org.languagetool:language-ca:6.6'
    shadowBundle 'org.languagetool:language-nl:6.6'
    shadowBundle 'org.languagetool:language-el:6.6'
    shadowBundle 'org.languagetool:language-ga:6.6'
    shadowBundle 'org.languagetool:language-ro:6.6'
    shadowBundle 'org.languagetool:language-sk:6.6'
    shadowBundle 'org.languagetool:language-pt:6.6'
    shadowBundle 'org.languagetool:language-fr:6.6'
    shadowBundle 'commons-validator:commons-validator:1.9.0'

    modules {
        module("com.sun.xml.bind:jaxb-core") {
            replacedBy("jakarta.xml.bind:jakarta.xml.bind-api")
        }
        module("com.sun.xml.txw2:txw2") {
            replacedBy("jakarta.xml.bind:jakarta.xml.bind-api")
        }
        module("com.sun.xml.bind:jaxb-impl") {
            replacedBy("jakarta.xml.bind:jakarta.xml.bind-api")
        }
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
